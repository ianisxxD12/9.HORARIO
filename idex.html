<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Horario 1º SMR</title>

    <style>
        body {
            font-family: "Times New Roman", serif;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 30px;
        }

        table {
            border-collapse: collapse;
            font-size: 20px;
        }

        th, td {
            border: 1px solid #999;
            padding: 3px 5px;
            text-align: left;
        }

        th {
            font-weight: bold;
        }

        .recreo {
            text-align: left;
            font-weight: normal;
        }
    </style>
</head>

<body>

    <h1>Horario 1° SMR</h1>

    <table>
        <tr>
            <th>Lunes</th>
            <th>Martes</th>
            <th>Miércoles</th>
            <th>Jueves</th>
            <th>Viernes</th>
        </tr>

        <tr>
            <td>MMEQ</td>
            <td>FOL</td>
            <td>SOM</td>
            <td>AWEB</td>
            <td>REDL</td>
        </tr>

        <tr>
            <td>MMEQ</td>
            <td>AWEB</td>
            <td>SOM</td>
            <td>AWEB</td>
            <td>REDL</td>
        </tr>

        <tr>
            <td>MMEQ</td>
            <td>AWEB</td>
            <td>FOL</td>
            <td>REDL</td>
            <td>MMEQ</td>
        </tr>

        <!-- Recreo -->
        <tr>
            <td colspan="5" class="recreo">Recreo</td>
        </tr>

        <tr>
            <td>ING</td>
            <td>MMEQ</td>
            <td>FOL</td>
            <td>REDL</td>
            <td>MMEQ</td>
        </tr>

        <tr>
            <td>REDL</td>
            <td>MMEQ</td>
            <td>AWEB</td>
            <td>SOM</td>
            <td>SOM</td>
        </tr>

        <tr>
            <td>REDL</td>
            <td>ING</td>
            <td>AWEB</td>
            <td>SOM</td>
            <td>SOM</td>
        </tr>
    </table>

</body>
</html>
